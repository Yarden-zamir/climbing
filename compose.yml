services:
  app:
    build: .
    # One process, one Redis. Revisit before adding replicas.
    scale: 1
    environment:
      KITSHN_RECIPE: ${KITSHN_RECIPE}
      KITSHN_ENVIRONMENT: ${KITSHN_ENVIRONMENT}
      KITSHN_DEPLOYMENT: ${KITSHN_DEPLOYMENT}
      KITSHN_DEFAULT_SOCKET: ${KITSHN_DEFAULT_SOCKET}
      ENVIRONMENT: production
      BASE_URL: ${BASE_URL:?BASE_URL is required}
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is required}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:?GOOGLE_CLIENT_ID is required}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:?GOOGLE_CLIENT_SECRET is required}
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      # Existing push subscriptions are bound to these keys; never let the app generate new ones.
      VAPID_PRIVATE_KEY_B64: ${VAPID_PRIVATE_KEY_B64:?VAPID_PRIVATE_KEY_B64 is required}
      VAPID_PUBLIC_KEY_B64: ${VAPID_PUBLIC_KEY_B64:?VAPID_PUBLIC_KEY_B64 is required}
      # /data holds climbing.duckdb, backups/ and keys/
      KITSHN_DATA_DIR: /data
      KEYS_DIR: /data/keys
    volumes:
      - ${KITSHN_SOCKET_DIR}:${KITSHN_SOCKET_DIR}
      - ${KITSHN_DATA_DIR}:/data
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/app/.venv/bin/python", "-c", "import http.client, socket; c = http.client.HTTPConnection('app'); c.sock = socket.socket(socket.AF_UNIX); c.sock.connect('${KITSHN_DEFAULT_SOCKET}'); c.request('GET', '/api/health'); assert c.getresponse().status == 200"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  # Legacy store, kept for one release: on first start the app imports it into DuckDB when the
  # database is empty. Remove this service, REDIS_* above and the redis dependency afterwards.
  redis:
    image: redis:7-alpine
    pull_policy: always
    # noeviction: this is the primary store, not a cache. Data is ~10 MB.
    # RDB snapshots only: with append-only on, Redis ignores a seeded dump.rdb and starts empty.
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--save", "60", "1", "--save", "300", "10", "--maxmemory", "512mb", "--maxmemory-policy", "noeviction"]
    volumes:
      - ${KITSHN_DATA_DIR}/redis:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    restart: unless-stopped
