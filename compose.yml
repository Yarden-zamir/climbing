services:
  app:
    build: .
    # One process, one Redis. Revisit before adding replicas.
    scale: 1
    environment:
      KITSHN_RECIPE: ${KITSHN_RECIPE}
      KITSHN_ENVIRONMENT: ${KITSHN_ENVIRONMENT}
      KITSHN_DEPLOYMENT: ${KITSHN_DEPLOYMENT}
      KITSHN_DEFAULT_SOCKET: ${KITSHN_DEFAULT_SOCKET}
      ENVIRONMENT: production
      BASE_URL: ${BASE_URL:?BASE_URL is required}
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is required}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:?GOOGLE_CLIENT_ID is required}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:?GOOGLE_CLIENT_SECRET is required}
      # Existing push subscriptions are bound to these keys; never let the app generate new ones.
      VAPID_PRIVATE_KEY_B64: ${VAPID_PRIVATE_KEY_B64:?VAPID_PRIVATE_KEY_B64 is required}
      VAPID_PUBLIC_KEY_B64: ${VAPID_PUBLIC_KEY_B64:?VAPID_PUBLIC_KEY_B64 is required}
      # /data holds climbing.duckdb, backups/ and keys/
      KITSHN_DATA_DIR: /data
      KEYS_DIR: /data/keys
    volumes:
      - ${KITSHN_SOCKET_DIR}:${KITSHN_SOCKET_DIR}
      - ${KITSHN_DATA_DIR}:/data
    healthcheck:
      test: ["CMD", "/app/.venv/bin/python", "-c", "import http.client, socket; c = http.client.HTTPConnection('app'); c.sock = socket.socket(socket.AF_UNIX); c.sock.connect('${KITSHN_DEFAULT_SOCKET}'); c.request('GET', '/api/health'); assert c.getresponse().status == 200"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    restart: unless-stopped
