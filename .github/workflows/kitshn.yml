name: kitshn

# kitshn 2 (https://kit.yarden-zamir.com) builds and runs compose.yml on a machine with the label deploy. Only main
# deploys (kitshn.config.ts); the KITSHN_* secrets of the GitHub Environment "prod" reach the app as before.
on:
  push:
    branches: [main]
  # kitshn 2 agent keys start a build of one branch (K-718).
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  kitshn:
    uses: Yarden-zamir/kitshn/.github/workflows/kitshn2-deploy.yml@main
    secrets: inherit
