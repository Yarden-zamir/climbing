name: Check

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Install Python dependencies
        run: uv sync --frozen

      - name: Compile Python sources
        run: uv run python -m compileall -q auth.py config.py dependencies.py main.py permissions.py store.py dates.py validation.py routes utils middleware models scripts tests

      - name: Lint
        run: uvx ruff check --select F --exclude .venv .

      - name: Install the browser for the browser tests
        run: uv run playwright install --with-deps chromium

      - name: End-to-end tests (API and browser)
        run: uv run pytest -q

      - name: Syntax-check JavaScript
        run: |
          for file in sw.js static/js/*.js static/js/pages/*.js; do
            case "$file" in *.min.js) continue ;; esac
            node --check "$file"
          done

      - name: Syntax-check inline page scripts
        run: |
          uv run python - <<'EOF'
          import pathlib, re, subprocess, sys
          failed = False
          for page in pathlib.Path("static").glob("*.html"):
              for index, script in enumerate(re.findall(r"<script>(.*?)</script>", page.read_text(), flags=re.S)):
                  target = pathlib.Path(f"/tmp/{page.stem}_{index}.js")
                  target.write_text(script)
                  result = subprocess.run(["node", "--check", str(target)], capture_output=True, text=True)
                  if result.returncode != 0:
                      failed = True
                      print(f"{page}: inline script {index} failed\n{result.stderr}")
          sys.exit(1 if failed else 0)
          EOF
