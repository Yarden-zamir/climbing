name: Knowledge diagram snapshot

# Re-render the Excalidraw diagram into the images the Knowledge page shows, so the page stays
# current without anyone exporting by hand. Runs daily and on demand.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies and the browser
        run: |
          uv sync --frozen
          uv run playwright install --with-deps chromium

      - name: Render the diagram
        id: render
        run: |
          uv run python scripts/snapshot_knowledge.py | tee render.log
          echo "changed=$(grep -qx changed render.log && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Commit the new images
        if: steps.render.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add static/knowledge-full.webp static/knowledge-preview.webp
          git commit -m "chore(knowledge): refresh diagram snapshot"
          git push

      # A push made with GITHUB_TOKEN starts no workflows, so ask for the deploy explicitly.
      - name: Deploy
        if: steps.render.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run kitshn.yml --ref main -f environment=prod
