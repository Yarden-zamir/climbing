<!DOCTYPE html>
<html lang="en">
<head>
	<script>
	(function () {
		var root = document.documentElement;
		if (document.referrer.startsWith(location.origin)) root.classList.add("quick-nav");
		// Paint the signed-in avatar from the cached snapshot before any script loads, so the nav never shifts
		try {
			var cached = JSON.parse(localStorage.getItem("auth_user_cache_v1") || "null");
			var user = cached && cached.authenticated && cached.user;
			if (user && user.id) {
				var picture = user.picture && (user.picture.indexOf("/images/") === 0 || user.picture.indexOf("/api/profile-picture/") === 0) ? user.picture : "/api/profile-picture/" + user.id;
				root.style.setProperty("--auth-avatar", "url(\"" + picture.replace(/"/g, "") + "\")");
				root.style.setProperty("--auth-name", JSON.stringify(String(user.name || "").slice(0, 24)));
				root.classList.add("has-user");
			}
		} catch (_) {}
	})();
	</script>
    <link id="favicon" rel="icon" type="image/x-icon" href="/static/favicon/favicon.ico">
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Track climbing crew member progress, achievements, and skill development. View leaderboards and climbing statistics for our community." />
    <title>Crew Progress</title>
    
    <!-- PWA manifest -->
    <link rel="manifest" href="/static/manifest.json">
    <meta name="theme-color" content="#bb86fc">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Climbing">
    
	    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/static/css/styles.css" />
    <!-- Cropper.js CSS -->
    <link rel="stylesheet" href="/static/css/cropper.min.css" media="print" onload="this.media='all'">
</head>
<body>
    <nav>
        <a href="/crew" class="active">Crew</a>
        <a href="/albums">Albums</a>
        <a href="/locations">Locations</a>
        <a href="/knowledge">Knowledge</a>
        <a href="/memes">Memes</a>
    	<span class="auth-slot"><span class="user-profile-btn auth-placeholder" aria-hidden="true"><span class="user-avatar"></span><span class="user-name"></span><span class="dropdown-arrow">▼</span></span></span>
    </nav>
    <main class="page-fade">
        <div id="crew-table-container"></div>
        
        <!-- Add Crew FAB -->
        <button class="add-crew-fab" id="add-crew-fab" style="background: linear-gradient(135deg, #ff7a3d 0%, #ff7a3d 100%); box-shadow: 0 6px 20px rgba(255, 174, 82, 0.4);">
            <span class="add-crew-fab-icon">➕</span>
        </button>
        
        <!-- Add Crew Modal -->
        <div class="add-crew-modal-overlay" id="add-crew-modal-overlay">
            <div class="add-crew-modal" id="add-crew-modal">
                <div class="add-crew-modal-header">
                    <h2 class="add-crew-modal-title">Add New Crew Member</h2>
                    <button class="add-crew-modal-close" id="add-crew-modal-close">×</button>
                </div>
                <form class="add-crew-form" id="add-crew-form">
                    <div class="form-group">
                        <label class="form-label" for="crew-name">Full Name</label>
                        <input 
                            type="text" 
                            id="crew-name" 
                            class="form-input" 
                            placeholder="Enter full name"
                            required
                        >
                        <div id="name-error" class="form-error" style="display: none;"></div>
                    </div>
                    
                    <div class="image-upload-container">
                        <label class="form-label">Profile Image</label>
                        <div class="image-upload-area" id="image-upload-area">
                            <input type="file" id="image-upload-input" class="upload-file-input" accept="image/*">
                            <div id="upload-content">
                                <div class="upload-text">
                                    📷 Click or drag to upload profile image<br>
                                    <small>(JPG, PNG, max 5MB)</small>
                                </div>
                            </div>
                        </div>
                    </div>
                    
                    <div class="form-group">
                        <label class="form-label">Location</label>
                        <div class="location-inputs">
                            <input 
                                type="text" 
                                id="location-city" 
                                class="form-input" 
                                placeholder="City"
                            >
                            <input 
                                type="text" 
                                id="location-country" 
                                class="form-input" 
                                placeholder="Country"
                            >
                        </div>
                    </div>
                    
                    <div class="skills-input-container">
                        <label class="form-label">Skills</label>
                        <div class="skills-badges-container" id="skills-badges-container">
                            <!-- Available skills badges will appear here -->
                        </div>
                    </div>
                    
                    <button type="submit" class="submit-btn" id="submit-crew-btn" disabled>
                        Add Crew Member
                    </button>
                    
                    <div id="submission-status" style="margin-top: 1rem; text-align: center;">
                        <!-- Submission status will appear here -->
                    </div>
                </form>
            </div>
        </div>

        <!-- Edit Crew FAB -->
        <button class="add-crew-fab" id="edit-crew-fab" title="Edit Crew" style="right: 5rem; background: #03dac6; box-shadow: 0 6px 20px rgba(3, 218, 198, 0.4); display: none;">
            <span class="add-crew-fab-icon">✏️</span>
        </button>

        <!-- Edit Crew Modal -->
        <div class="add-crew-modal-overlay" id="edit-crew-modal-overlay">
            <div class="add-crew-modal" id="edit-crew-modal">
                <div class="add-crew-modal-header">
                    <h2 class="add-crew-modal-title">Edit Crew Member</h2>
                    <button class="add-crew-modal-close" id="edit-crew-modal-close">×</button>
                </div>
                <form class="add-crew-form" id="edit-crew-form">
                    <div class="form-group">
                        <label class="form-label" for="edit-crew-name">Full Name</label>
                        <input 
                            type="text" 
                            id="edit-crew-name" 
                            class="form-input" 
                            placeholder="Enter full name"
                            required
                        >
                        <div id="edit-name-error" class="form-error" style="display: none;"></div>
                    </div>
                    
                    <div class="image-upload-container">
                        <label class="form-label">Profile Image</label>
                        <div class="image-upload-area" id="edit-image-upload-area">
                            <input type="file" id="edit-image-upload-input" class="upload-file-input" accept="image/*">
                            <div id="edit-upload-content">
                                <div class="upload-text">
                                    📷 Click or drag to upload profile image<br>
                                    <small>(JPG, PNG, max 5MB)</small>
                                </div>
                            </div>
                        </div>
                    </div>
                    
                    <div class="form-group">
                        <label class="form-label">Location</label>
                        <div class="location-inputs">
                            <input 
                                type="text" 
                                id="edit-location-city" 
                                class="form-input" 
                                placeholder="City"
                            >
                            <input 
                                type="text" 
                                id="edit-location-country" 
                                class="form-input" 
                                placeholder="Country"
                            >
                        </div>
                    </div>
                    
                    <div class="skills-input-container">
                        <label class="form-label">Skills</label>
                        <div class="skills-badges-container" id="edit-skills-badges-container">
                            <!-- Available skills badges will appear here -->
                        </div>
                    </div>
                    
                    <div style="display: flex; gap: 1rem;">
                        <button type="submit" class="submit-btn" id="edit-submit-crew-btn" disabled>
                            Update Crew Member
                        </button>
                        <button type="button" class="submit-btn" id="delete-crew-btn" style="
                            background: linear-gradient(135deg, #cf6679 0%, #b71c1c 100%);
                            color: white;
                            padding: 0.75rem 1rem;
                            font-size: 0.9rem;
                        ">
                            🗑️ Delete
                        </button>
                    </div>
                    
                    <div id="edit-submission-status" style="margin-top: 1rem; text-align: center;">
                        <!-- Submission status will appear here -->
                    </div>
                </form>
            </div>
        </div>
        
        <!-- Image Cropping Modal -->
        <div class="crop-modal-overlay" id="crop-modal-overlay">
            <div class="crop-modal" id="crop-modal">
                <div class="crop-modal-header">
                    <h2 class="crop-modal-title">Crop Profile Image</h2>
                    <button class="crop-modal-close" id="crop-modal-close">×</button>
                </div>
                <div class="crop-modal-body">
                    <div class="crop-container">
                        <img id="crop-image" class="crop-image" alt="Image to crop" width="400" height="400">
                    </div>
                </div>
                <div class="crop-modal-footer">
                    <button type="button" class="crop-btn crop-btn-cancel" id="crop-cancel-btn">Cancel</button>
                    <button type="button" class="crop-btn crop-btn-confirm" id="crop-confirm-btn">Crop & Use</button>
                </div>
            </div>
        </div>

        <!-- Add Items Modal (Skills, Tags, Achievements) -->
        <div class="add-crew-modal-overlay" id="add-items-modal-overlay">
            <div class="add-crew-modal" id="add-items-modal">
                <div class="add-crew-modal-header">
                    <h3 class="add-crew-modal-title" id="add-items-modal-title">Add Items</h3>
                    <button class="add-crew-modal-close" id="add-items-modal-close">&times;</button>
                </div>
                <div class="add-crew-form">
                    <div class="form-group">
                        <label class="form-label">Item Type</label>
                        <select id="item-type-select" class="form-input" style="margin-bottom: 1rem;">
                            <option value="skills">Skills</option>
                            <option value="achievements">Achievements</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label class="form-label" id="available-items-label">Available Items</label>
                        <div class="skills-badges-container" id="add-items-badges-container">
                            <!-- Available items badges will appear here -->
                        </div>
                    </div>
                    <div style="display: flex; gap: 1rem; justify-content: flex-end;">
                        <button type="button" class="submit-btn" id="add-items-cancel-btn" style="background: #666;">Cancel</button>
                        <button type="button" class="submit-btn" id="add-items-submit-btn">Add Items</button>
                    </div>
                </div>
            </div>
        </div>
    </main>
<footer class="site-footer"><a href="/privacy">Privacy policy</a></footer>
    
    <!-- Cropper.js JavaScript -->
    <script src="/static/js/api.js"></script>
    <script src="/static/js/cropper.min.js"></script>
    <script src="/static/js/pages/crew.js"></script>
    <!-- PWA and Notification Management -->
    <script src="/static/js/pwa-manager.js" defer></script>
    <script src="/static/js/notification-health-manager.js" defer></script>
    <script src="/static/js/notifications.js" defer></script>
    <script src="/static/js/cache-manager.js" defer></script>
    <script src="/static/js/update-notifier.js" defer></script>
    <script src="/static/js/auth.js" defer></script>


</body>
</html>
