<!DOCTYPE html>
<html lang="en">
	<head>
	<script>
	(function () {
		var root = document.documentElement;
		if (document.referrer.startsWith(location.origin)) root.classList.add("quick-nav");
		// Paint the signed-in avatar from the cached snapshot before any script loads, so the nav never shifts
		try {
			var cached = JSON.parse(localStorage.getItem("auth_user_cache_v1") || "null");
			var user = cached && cached.authenticated && cached.user;
			if (user && user.id) {
				var picture = user.picture && (user.picture.indexOf("/images/") === 0 || user.picture.indexOf("/api/profile-picture/") === 0) ? user.picture : "/api/profile-picture/" + user.id;
				root.style.setProperty("--auth-avatar", "url(\"" + picture.replace(/"/g, "") + "\")");
				root.style.setProperty("--auth-name", JSON.stringify(String(user.name || "").slice(0, 24)));
				root.classList.add("has-user");
			}
		} catch (_) {}
	})();
	</script>
		<link id="favicon" rel="icon" type="image/x-icon" href="/static/favicon/favicon.ico">
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<meta name="description" content="Explore our interactive climbing knowledge base with routes, techniques, and community insights. Visual diagrams and maps for climbers." />
		<title>Knowledge</title>
		
		<!-- PWA manifest -->
		<link rel="manifest" href="/static/manifest.json">
		<meta name="theme-color" content="#bb86fc">
		<meta name="apple-mobile-web-app-capable" content="yes">
		<meta name="apple-mobile-web-app-status-bar-style" content="default">
		<meta name="apple-mobile-web-app-title" content="Climbing">
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&display=swap"
			rel="stylesheet"
		/>
		<link rel="stylesheet" href="/static/css/styles.css" />
		<link rel="preload" href="/static/js/auth.js" as="script">
			<style>
			.knowledge-stage { position: relative; width: 100%; height: calc(100vh - 70px); background: #fff; overflow: hidden; touch-action: none; cursor: grab; user-select: none; -webkit-user-select: none; outline: none; }
			.knowledge-stage.dragging { cursor: grabbing; }
			.knowledge-canvas { position: absolute; left: 0; top: 0; transform-origin: 0 0; will-change: transform; }
			.knowledge-image { display: block; pointer-events: none; }
			.knowledge-controls { position: absolute; right: 0.75rem; bottom: 0.75rem; display: flex; gap: 0.35rem; align-items: center; background: rgba(18,18,18,0.85); border-radius: 999px; padding: 0.3rem; }
			.knowledge-controls button { width: 38px; height: 38px; border-radius: 50%; border: 0; background: #2a2a2a; color: #fff; font: inherit; font-size: 1.1rem; cursor: pointer; }
			.knowledge-controls button[data-zoom="fit"] { width: auto; padding: 0 0.8rem; border-radius: 999px; font-size: 0.85rem; }
			.knowledge-controls button:hover { background: #03dac6; color: #111; }
			.knowledge-link { color: #ccc; font-size: 0.8rem; text-decoration: none; padding: 0 0.6rem; }
			.knowledge-link:hover { color: #fff; text-decoration: underline; }
		</style>
	</head>
	<body>
		<nav>
			<a href="/crew">Crew</a>
			<a href="/albums">Albums</a>
			<a href="/locations">Locations</a>
			<a href="/knowledge" class="active">Knowledge</a>
			<a href="/memes">Memes</a>
			<span class="auth-slot"><span class="user-profile-btn auth-placeholder" aria-hidden="true"><span class="user-avatar"></span><span class="user-name"></span><span class="dropdown-arrow">▼</span></span></span>
		</nav>
		<!-- The diagram is a pre-rendered image (scripts/snapshot_knowledge.py keeps it current):
		     it shows at once and pans and zooms like a diagram. Excalidraw itself opens on request. -->
		<div class="knowledge-stage" id="knowledge-stage" tabindex="0" aria-label="Climbing knowledge diagram. Drag to pan, scroll or pinch to zoom.">
			<div class="knowledge-canvas" id="knowledge-canvas">
				<img class="knowledge-image" id="knowledge-image" src="/static/knowledge-preview.webp" width="2565" height="3100" alt="Climbing knowledge diagram: sport climbing procedures, partner checks, knots, belay devices and self belay" draggable="false" decoding="async" fetchpriority="high">
			</div>
			<div class="knowledge-controls">
				<button type="button" data-zoom="in" aria-label="Zoom in">+</button>
				<button type="button" data-zoom="out" aria-label="Zoom out">−</button>
				<button type="button" data-zoom="fit" aria-label="Fit to screen">Fit</button>
				<a class="knowledge-link" href="https://link.excalidraw.com/readonly/AtAowLIPvMThzN3XHsEf" target="_blank" rel="noopener" title="Open the live diagram in Excalidraw">Excalidraw ↗</a>
			</div>
		</div>
		<script src="/static/js/pages/knowledge.js"></script>
		<!-- PWA and Notification Management -->
		<script src="/static/js/api.js"></script>
		<script src="/static/js/pwa-manager.js" defer></script>
		<script src="/static/js/notification-health-manager.js" defer></script>
		<script src="/static/js/notifications.js" defer></script>
		<script src="/static/js/cache-manager.js" defer></script>
		<script src="/static/js/update-notifier.js" defer></script>
		<script src="/static/js/auth.js" defer></script>

		<footer class="site-footer"><a href="/privacy">Privacy policy</a></footer>

	</body>
</html>
