<!DOCTYPE html>
<html lang="en">
	<head>
	<script>
	(function () {
		var root = document.documentElement;
		if (document.referrer.startsWith(location.origin)) root.classList.add("quick-nav");
		// Paint the signed-in avatar from the cached snapshot before any script loads, so the nav never shifts
		try {
			var cached = JSON.parse(localStorage.getItem("auth_user_cache_v1") || "null");
			var user = cached && cached.authenticated && cached.user;
			if (user && user.id) {
				var picture = user.picture && (user.picture.indexOf("/images/") === 0 || user.picture.indexOf("/api/profile-picture/") === 0) ? user.picture : "/api/profile-picture/" + user.id;
				root.style.setProperty("--auth-avatar", "url(\"" + picture.replace(/"/g, "") + "\")");
				root.style.setProperty("--auth-name", JSON.stringify(String(user.name || "").slice(0, 24)));
				root.classList.add("has-user");
			}
		} catch (_) {}
	})();
	</script>
		<link id="favicon" rel="icon" type="image/x-icon" href="/static/favicon/favicon.ico">
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<meta name="description" content="Explore our interactive climbing knowledge base with routes, techniques, and community insights. Visual diagrams and maps for climbers." />
		<title>Knowledge</title>
		
		<!-- PWA manifest -->
		<link rel="manifest" href="/static/manifest.json">
		<meta name="theme-color" content="#bb86fc">
		<meta name="apple-mobile-web-app-capable" content="yes">
		<meta name="apple-mobile-web-app-status-bar-style" content="default">
		<meta name="apple-mobile-web-app-title" content="Climbing">
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&display=swap"
			rel="stylesheet"
		/>
		<link rel="stylesheet" href="/static/css/styles.css" />
		<link rel="preload" href="/static/js/auth.js" as="script">
			<style>
			.knowledge-stage { position: relative; width: 100%; height: calc(100vh - 70px); background: #fff; overflow: hidden; }
			.knowledge-stage .knowledge-preview { display: block; width: 100%; height: 100%; object-fit: contain; object-position: top center; }
			.knowledge-stage .main-iframe { position: absolute; inset: 0; width: 100%; height: 100%; margin: 0; border: 0; opacity: 0; transition: opacity 0.4s ease; }
			.knowledge-stage.live .main-iframe { opacity: 1; }
			.knowledge-stage.live .knowledge-preview, .knowledge-stage.live .knowledge-open, .knowledge-stage.live .knowledge-link { visibility: hidden; }
			.knowledge-open { position: absolute; left: 50%; bottom: 2rem; transform: translateX(-50%); background: #03dac6; color: #111; border: 0; border-radius: 999px; padding: 0.8rem 1.4rem; font: inherit; font-weight: 600; cursor: pointer; box-shadow: 0 6px 20px rgba(0,0,0,0.35); }
			.knowledge-stage.loading .knowledge-open::after { content: " loading…"; font-weight: 400; }
			.knowledge-link { position: absolute; right: 1rem; bottom: 2.4rem; color: #555; font-size: 0.85rem; text-decoration: none; }
			.knowledge-link:hover { text-decoration: underline; color: #222; }
			@media (max-width: 600px) { .knowledge-stage { height: calc(100vh - 70px); } }
		</style>
	</head>
	<body>
		<nav>
			<a href="/crew">Crew</a>
			<a href="/albums">Albums</a>
			<a href="/locations">Locations</a>
			<a href="/knowledge" class="active">Knowledge</a>
			<a href="/memes">Memes</a>
			<span class="auth-slot"><span class="user-profile-btn auth-placeholder" aria-hidden="true"><span class="user-avatar"></span><span class="user-name"></span><span class="dropdown-arrow">▼</span></span></span>
		</nav>
		<!-- Excalidraw takes many seconds to boot; show a static preview at once and load the live
		     diagram only when someone wants to interact with it. -->
		<div class="knowledge-stage" id="knowledge-stage">
			<img class="knowledge-preview" src="/static/knowledge-preview.webp" alt="Climbing knowledge diagram: sport climbing procedures, partner checks, knots, belay devices and self belay" width="1760" height="1314" decoding="async" fetchpriority="high">
			<button class="knowledge-open" id="knowledge-open" type="button">Open interactive diagram</button>
			<a class="knowledge-link" href="https://link.excalidraw.com/readonly/AtAowLIPvMThzN3XHsEf" target="_blank" rel="noopener">Open in Excalidraw ↗</a>
		</div>
		<script>
			document.getElementById('knowledge-open').addEventListener('click', () => {
				const stage = document.getElementById('knowledge-stage');
				const frame = document.createElement('iframe');
				frame.src = 'https://link.excalidraw.com/readonly/AtAowLIPvMThzN3XHsEf';
				frame.className = 'main-iframe';
				frame.title = 'Interactive climbing knowledge diagram';
				stage.classList.add('loading');
				frame.addEventListener('load', () => stage.classList.add('live'));
				stage.appendChild(frame);
			});
		</script>
		<!-- PWA and Notification Management -->
		<script src="/static/js/api.js"></script>
		<script src="/static/js/pwa-manager.js" defer></script>
		<script src="/static/js/notification-health-manager.js" defer></script>
		<script src="/static/js/notifications.js" defer></script>
		<script src="/static/js/cache-manager.js" defer></script>
		<script src="/static/js/update-notifier.js" defer></script>
		<script src="/static/js/auth.js" defer></script>

		<footer class="site-footer"><a href="/privacy">Privacy policy</a></footer>

	</body>
</html>
